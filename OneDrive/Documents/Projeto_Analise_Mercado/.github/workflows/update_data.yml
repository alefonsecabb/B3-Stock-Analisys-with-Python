name: Atualizar Dados de Mercado

on:
  schedule:
    # 02:00 UTC = 23:00 BRT, após o fechamento da B3 (~21:00 UTC / 18:00 BRT)
    - cron: '0 2 * * 1-5'
  workflow_dispatch:  # permite disparo manual

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Gerar arquivos de dados
        run: python scripts/generate_data.py

      - name: Commitar e publicar se houver mudanças
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "chore: atualizar dados de mercado $(date -u +'%Y-%m-%d')"
          git push
